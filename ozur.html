<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100b1c">
<title>Özür Dilerim — Yağmur</title>
<style>
  :root { color-scheme: dark; --ink: #fff7fb; --muted: #c8b7d7; --pink: #ff8fbd; --violet: #c2a0ff; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 15%, #3b214b 0%, #1c1229 44%, #100b1c 100%);
  }
  .glow { position: fixed; inset: auto; width: 50vw; height: 50vw; left: 25vw; top: 34vh; border-radius: 50%; background: #df6cae; filter: blur(130px); opacity: .12; pointer-events: none; }
  #rain { position: fixed; inset: 0; overflow: hidden; }
  .drop { position: absolute; top: -12vh; white-space: nowrap; color: var(--ink); opacity: 0; font-weight: 600; text-shadow: 0 2px 20px #ff8fbd66; animation: fall linear infinite; will-change: transform, opacity; }
  .drop:nth-child(4n) { color: #ffd3e7; }
  .drop:nth-child(4n + 1) { color: #d9c8ff; }
  .drop:nth-child(4n + 2) { color: #fff7fb; }
  @keyframes fall { 0% { transform: translate3d(0,-8vh,0) rotate(-3deg); opacity: 0; } 8% { opacity: var(--opacity, .74); } 88% { opacity: var(--opacity, .74); } 100% { transform: translate3d(var(--drift, 20px),112vh,0) rotate(4deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .drop { animation-duration: 30s !important; } }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main id="rain" aria-label="Farklı dillerde özür dilerim yazılarının yağmuru"></main>
<script>
const phrases = [
  ['Türkçe','Özür dilerim'], ['English','I’m sorry'], ['Español','Lo siento'], ['Français','Je suis désolé'], ['Deutsch','Es tut mir leid'],
  ['Italiano','Mi dispiace'], ['Português','Sinto muito'], ['Nederlands','Het spijt me'], ['Svenska','Förlåt'], ['Norsk','Unnskyld'],
  ['Dansk','Undskyld'], ['Suomi','Olen pahoillani'], ['Íslenska','Fyrirgefðu'], ['Ελληνικά','Συγγνώμη'], ['Русский','Прости'],
  ['Українська','Вибач'], ['Polski','Przepraszam'], ['Čeština','Promiň'], ['Slovenčina','Prepáč'], ['Magyar','Sajnálom'],
  ['Română','Îmi pare rău'], ['Български','Съжалявам'], ['Српски','Извини'], ['Hrvatski','Žao mi je'], ['Shqip','Më fal'],
  ['ქართული','ბოდიში'], ['Հայերեն','Կներես'], ['العربية','أنا آسف'], ['עברית','אני מצטער'], ['فارسی','متأسفم'],
  ['हिन्दी','मुझे माफ़ करें'], ['বাংলা','আমি দুঃখিত'], ['ਪੰਜਾਬੀ','ਮੈਨੂੰ ਮਾਫ਼ ਕਰਨਾ'], ['اردو','مجھے افسوس ہے'], ['नेपाली','माफ गर्नुहोस्'],
  ['中文','对不起'], ['日本語','ごめんなさい'], ['한국어','미안해요'], ['ภาษาไทย','ขอโทษ'], ['Tiếng Việt','Tôi xin lỗi'],
  ['Bahasa Indonesia','Maaf'], ['Bahasa Melayu','Saya minta maaf'], ['Filipino','Pasensya na'], ['မြန်မာ','တောင်းပန်ပါတယ်'], ['ខ្មែរ','សុំទោស'],
  ['Kiswahili','Samahani'], ['Afrikaans','Ek is jammer'], ['isiZulu','Ngiyaxolisa'], ['አማርኛ','ይቅርታ'], ['ქართული','ბოდიში'],
  ['ქართული','ბოდიში'], ['Català','Ho sento'], ['Galego','Síntoo'], ['Euskara','Barkatu'], ['Gaeilge','Tá brón orm'],
  ['Cymraeg','Mae’n ddrwg gen i'], ['Esperanto','Pardonu'], ['Latina','Paenitet me'], ['Hawaiʻi','E kala mai'], ['Māori','Aroha mai'],
  ['فارسی','ببخشید'], ['தமிழ்','மன்னிக்கவும்'], ['తెలుగు','క్షమించండి'], ['ಕನ್ನಡ','ಕ್ಷಮಿಸಿ'], ['മലയാളം','ക്ഷമിക്കണം'],
  ['ಕನ್ನಡ','ಕ್ಷಮಿಸಿ'], ['मराठी','मला माफ करा'], ['ગુજરાતી','મને માફ કરશો'], ['O‘zbekcha','Kechirasiz'], ['Қазақша','Кешіріңіз'],
  ['Монгол','Уучлаарай'], ['Azərbaycanca','Bağışla'], ['Bosanski','Žao mi je'], ['Македонски','Извини'], ['Lietuvių','Atsiprašau'],
  ['Latviešu','Piedod'], ['Eesti','Vabandust'], ['עברית','סליחה'], ['ייִדיש','עס טוט מיר לייד'], ['Kreyòl ayisyen','Mwen regrèt'],
  ['Kurdî','Bibore'], ['پښتو','بخښنه غواړم'], ['ქართული','ბოდიში'], ['ئۇيغۇرچە','كەچۈرۈڭ'], ['ລາວ','ຂໍໂທດ']
];
const rain = document.querySelector('#rain');
function makeDrop(i) {
  const [, phrase] = phrases[i % phrases.length];
  const el = document.createElement('span');
  el.className = 'drop';
  el.textContent = `${phrase} yağmur`;
  const size = 14 + Math.random() * 15;
  const duration = 9 + Math.random() * 17;
  el.style.left = `${Math.random() * 96}%`;
  el.style.fontSize = `${size}px`;
  el.style.animationDuration = `${duration}s`;
  el.style.animationDelay = `${-Math.random() * duration}s`;
  el.style.setProperty('--drift', `${Math.round(Math.random() * 110 - 55)}px`);
  el.style.setProperty('--opacity', `${0.42 + Math.random() * 0.4}`);
  rain.appendChild(el);
}
for (let i = 0; i < 82; i++) makeDrop(i);
</script>
</body>
</html>
