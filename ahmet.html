<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ahmet butona bas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative select-none p-4">

    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-zinc-900 via-black to-black opacity-90 pointer-events-none"></div>

    <main class="z-10 flex flex-col items-center justify-center text-center max-w-xl w-full my-8">
        
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-8 text-zinc-200">
            ahmet butona <span id="title-bas" class="cursor-pointer hover:text-white transition-colors">bas</span>
        </h1>

        <div id="button-container" class="relative w-full h-36 flex items-center justify-center mb-6">
            <button id="ahmet-btn" 
                class="absolute px-8 py-4 bg-white text-black font-bold rounded-xl shadow-[0_0_25px_rgba(255,255,255,0.3)] hover:shadow-[0_0_35px_rgba(255,255,255,0.6)] transition-all duration-75 text-lg cursor-pointer transform active:scale-95">
                bana bas
            </button>
        </div>

    </main>

    <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="w-16 h-16 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                ⚠️
            </div>
            <h3 class="text-2xl font-bold mb-2 text-white">Sürpriz!</h3>
            <p id="modal-msg" class="text-zinc-400 text-lg mb-4 font-medium">hadi gideriz amk faqirii</p>
            
            <button id="close-modal" class="w-full py-3 bg-white text-black font-bold rounded-xl hover:bg-zinc-200 transition-colors cursor-pointer">
                Tamam
            </button>
        </div>
    </div>

    <script>
        const btn = document.getElementById('ahmet-btn');
        const titleBas = document.getElementById('title-bas');
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modal-content');
        const closeModal = document.getElementById('close-modal');

        let isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        function moveButton() {
            const btnRect = btn.getBoundingClientRect();
            const padding = 40;
            
            const maxX = window.innerWidth - btnRect.width - padding;
            const maxY = window.innerHeight - btnRect.height - padding;
            const minX = padding;
            const minY = padding;

            const randomX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
            const randomY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;

            btn.style.position = 'fixed';
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        btn.addEventListener('mouseenter', () => {
            if (!isTouchDevice) {
                moveButton();
            }
        });

        btn.addEventListener('touchstart', (e) => {
            if (isTouchDevice) {
                moveButton();
                e.preventDefault();
            }
        });

        titleBas.addEventListener('click', (e) => {
            e.stopPropagation();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        });

        closeModal.addEventListener('click', () => {
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 200);
        });

        window.addEventListener('resize', () => {
            btn.style.position = 'relative';
            btn.style.left = 'auto';
            btn.style.top = 'auto';
        });
    </script>

</body>
</html>
